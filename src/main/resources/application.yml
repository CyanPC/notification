spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${email}
    password: ${emailPassword}
    protocol: smtp
    properties:
      mail:
        smtp:
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  thymeleaf:
    enable: true
sent:
  email:
    from: ${email}
    fromName: Scheduler Notifier

server:
  port: 8082





